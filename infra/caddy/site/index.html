<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telefoninho</title>
    <meta name="description" content="Telefoninho, um telefone simples para familias." />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1df;
        --ink: #25251f;
        --muted: #68665e;
        --line: #d7cfb8;
        --accent: #2f7d54;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      main {
        width: min(100% - 2rem, 560px);
        padding: 2rem 0;
      }

      .mark {
        width: 3rem;
        height: 3rem;
        margin-bottom: 2rem;
        border: 4px solid var(--ink);
        box-shadow: 8px 8px 0 var(--accent);
        background: #fffdf6;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 11vw, 5.5rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 32rem;
        margin: 1.25rem 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .links {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 2px solid var(--line);
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Telefoninho</h1>
      <p>Um telefone simples para familias. Site em construcao.</p>
      <div class="links">
        <a href="https://admin.telefoninho.com.br">admin</a>
        <a href="https://api.telefoninho.com.br/health">api status</a>
        <a href="/privacy.html">privacidade</a>
      </div>
    </main>
  </body>
</html>
