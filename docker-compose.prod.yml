services:
  caddy:
    image: caddy:2-alpine
    container_name: telefoninho-caddy
    restart: unless-stopped
    depends_on:
      - api
      - parent-web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: telefoninho-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/data/telefoninho.db
      - API_BASE_URL=https://${API_DOMAIN}
      - ASTERISK_HOST=${SIP_DOMAIN}
      - ASTERISK_PJSIP_PORT=5060
      - ASTERISK_AMI_HOST=asterisk
      - ASTERISK_AMI_PORT=5038
      - ASTERISK_AMI_USERNAME=${ASTERISK_AMI_USERNAME:-telefoninho-api}
      - ASTERISK_AMI_PASSWORD=${ASTERISK_AMI_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PAIRING_CODE_TTL_MINUTES=${PAIRING_CODE_TTL_MINUTES:-20}
      - SEED_DEMO=${SEED_DEMO:-false}
    expose:
      - "3001"
    volumes:
      - api-data:/data
      - ./infra/asterisk/config:/app/infra/asterisk/config

  parent-web:
    build:
      context: .
      dockerfile: apps/parent-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}
    container_name: telefoninho-parent-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=https://${API_DOMAIN}
    expose:
      - "3000"
    depends_on:
      - api

  asterisk:
    build: ./infra/asterisk
    container_name: telefoninho-asterisk
    restart: unless-stopped
    environment:
      - ASTERISK_AMI_USERNAME=${ASTERISK_AMI_USERNAME:-telefoninho-api}
      - ASTERISK_AMI_PASSWORD=${ASTERISK_AMI_PASSWORD}
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./infra/asterisk/config:/etc/asterisk

volumes:
  api-data:
  caddy-data:
  caddy-config:
